# A generic Alembic configuration file.
# https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file

[alembic]
# path to migration scripts
script_location = alembic

# template for migration file names, e.g. %%(rev)s_%%(slug)s.py
file_template = %%(rev)s_%%(slug)s

# timezone for migration file names, e.g. "UTC" or "local"
# timezone =

# sys.path entries, comma separated
# prepend_sys_path = .

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S

# Relative paths used below are resolved against the location of this
# configuration file.
# sqlalchemy.url = driver://user:pass@localhost/dbname
# Using a relative path for SQLite, assuming alembic is run from `backend/` directory.
# The path should point to where spindex_aegis.db will be created by database.py
# os.path.join(os.path.dirname(os.path.abspath(__file__)), "spindex_aegis.db")
# results in /app/backend/spindex_aegis.db (assuming this ini is in /app/backend/)
# So the URL should be sqlite:///./spindex_aegis.db if alembic is run from /app/backend
# If alembic is run from /app, then it would be sqlite:///backend/spindex_aegis.db
# For simplicity, we'll assume alembic commands are run from the `backend` directory.
sqlalchemy.url = sqlite:///./spindex_aegis.db
# If you need to use environment variables for sensitive data or for flexibility:
# sqlalchemy.url = %(DB_CONNECTION_STRING)s


# Optional arguments for an Alembic Context.
# context_opts = {}

# Further options:
# revision_environment = false
# output_encoding = utf-8
# sourceless = false
# version_path_separator = os  # Use os.pathsep. Default is "os"
# truncate_slug_length = 40
# timezone =
# user =
# password =

# Post-write hooks are programs or scripts that are run after a migration is generated.
# Example:
# post_write_hooks = autopep8, black
# autopep8.type = console
# autopep8.entrypoint = autopep8
# autopep8.options = --in-place %%(path)s
# black.type = console
# black.entrypoint = black
# black.options = %%(path)s

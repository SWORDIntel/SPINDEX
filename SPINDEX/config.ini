# SPINDEX Configuration File
# Simple key=value format (no sections)

# Plugin directory where .so files are located
plugin_directory=build_cmake/lib/spindex/plugins

# Log file path
log_file_path=/tmp/spindex.log

# Log level: DEBUG, INFO, WARN, ERROR
log_level=INFO

# Maximum concurrent file processing
max_concurrent_files=4

# Input buffer size in bytes
input_buffer_size=8388608

# Elasticsearch connection
elasticsearch_url=http://localhost:9200
elasticsearch_index_name=spindex_documents

# Active indexer plugin
active_indexer_name=elasticsearch_indexer

# NLP Named Entity Recognition
nlp_ner_enabled=false
nlp_ner_python_executable=/usr/bin/python3
nlp_ner_script_path=plugins/aegis_modules/scripts/ner_spacy.py

# SPINDEX Configuration File
# Copy this to config.ini and customize for your environment

[Paths]
# Directory where plugin .so files are located
PluginDirectory=/home/user/SPINDEX/SPINDEX/build_cmake/lib/spindex/plugins

# Log file location
LogFilePath=/tmp/spindex.log

[Logging]
# Log levels: DEBUG, INFO, WARN, ERROR
LogLevel=INFO

[Performance]
# Maximum number of files to process concurrently
MaxConcurrentFiles=4

# Input buffer size in bytes (for file reading)
InputBufferSize=8388608

[Elasticsearch]
# Elasticsearch connection URL
ElasticsearchURL=http://localhost:9200

# Index name for storing processed documents
ElasticsearchIndexName=spindex_documents

# Active indexer plugin name
ActiveIndexerName=elasticsearch_indexer

[NLP]
# Enable NLP Named Entity Recognition
NLPNEREnabled=false

# Python executable for NLP processing
NLPNERPythonExecutable=/usr/bin/python3

# Path to NLP NER script
NLPNERScriptPath=/home/user/SPINDEX/scripts/ner_processor.py

[Geometry]
# Enable complex geometry handler
ComplexGeometryHandlerEnabled=true

# Path to ogr2ogr for topology processing
ComplexGeometryOGRTopologyPath=/usr/bin/ogr2ogr

# Enable geometric validator
GeometricValidatorEnabled=true

# Automatically repair invalid geometries
GeometricValidatorRepairInvalid=true

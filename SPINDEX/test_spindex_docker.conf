# SPINDEX Configuration File for Docker Environment

# Directory where plugin .so files are located
# Corresponds to where plugins are copied in the runtime stage of the Dockerfile
plugin_directory = /opt/spindex/lib/

# Path for the application log file
# The /var/log/spindex directory must be created and be writable by spindex_user
log_file_path = /var/log/spindex/spindex_app.log

# Log level for the application
# Options: ERROR, WARN, INFO, DEBUG, TRACE
log_level = INFO

# Maximum number of files to process concurrently by the ingestion pipeline
max_concurrent_files = 10

# Input buffer size for file operations (in bytes)
input_buffer_size = 8192

# Elasticsearch client settings (if elasticsearch_indexer plugin is used)
# These would be read by the elasticsearch_client or the indexer plugin if configured.
# Example:
# elasticsearch_url = http://elasticsearch:9200
# default_index_name = spindex_default_index

# Note: Paths for files_to_process in main.c are relative to the
# application's working directory, which is /opt/spindex.
# e.g., "data/test_data/sample.json" would resolve to "/opt/spindex/data/test_data/sample.json"

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: spindex_postgres
    environment:
      POSTGRES_USER: spindex_user
      POSTGRES_PASSWORD: spindex_password
      POSTGRES_DB: spindex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spindex_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spindex_user -d spindex_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: spindex_redis
    ports:
      - "6379:6379"
    networks:
      - spindex_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:7.17.10
    container_name: spindex_elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - spindex_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spindex_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: "postgresql://spindex_user:spindex_password@postgres:5432/spindex_db"

      # Celery
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"

      # Elasticsearch
      ELASTICSEARCH_HOST: "http://elasticsearch:9200"

      # Authentication tokens (change in production!)
      AEGIS_TOKEN_ADMIN: "secure-dev-token-admin"
      AEGIS_TOKEN_ANALYST: "secure-dev-token-analyst"
      AEGIS_TOKEN_VIEWER: "secure-dev-token-viewer"

      # Security settings
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: "60"
      RATE_LIMIT_PER_HOUR: "1000"
      ENABLE_SECURITY_HEADERS: "true"

      # App settings
      PYTHONUNBUFFERED: "1"
    volumes:
      # Mount directories for file operations
      - ./staging_area:/app/backend/staging_area
      - ./processed_area:/app/backend/processed_area
      - ./trusted_data_area:/app/backend/trusted_data_area
    networks:
      - spindex_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Vue.js Frontend
  frontend:
    build:
      context: ./gui
      dockerfile: Dockerfile
    container_name: spindex_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - spindex_network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  spindex_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  elasticsearch_data:
    driver: local

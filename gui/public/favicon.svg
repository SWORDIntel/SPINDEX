<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>

  <!-- Index symbol (3 horizontal lines) -->
  <rect x="20" y="30" width="60" height="8" fill="white" rx="4"/>
  <rect x="20" y="46" width="60" height="8" fill="white" rx="4"/>
  <rect x="20" y="62" width="60" height="8" fill="white" rx="4"/>

  <!-- Speed indicator (lightning bolt overlay) -->
  <path d="M 65 20 L 55 45 L 65 45 L 55 75 L 75 45 L 65 45 Z"
        fill="#ffd93d"
        opacity="0.9"
        stroke="#f39c12"
        stroke-width="1"/>
